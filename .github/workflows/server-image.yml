# Dev server image (TDD §3.1a, M1 spike 6): build the Docker image, start the headless server and connect a client to it.
# Job b2 runs the short B2 benchmark with bots and netem (spike 2).
name: server-image

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - name: Build the dev server image
        run: docker compose -f docker-compose.dev.yml build server
      - name: Start the server
        run: docker compose -f docker-compose.dev.yml up -d server
      - name: Wait until it listens
        run: |
          for i in $(seq 1 60); do
            if docker compose -f docker-compose.dev.yml logs server | grep -q '"server.listening"'; then exit 0; fi
            sleep 2
          done
          echo "Server did not start"; docker compose -f docker-compose.dev.yml logs server; exit 1
      - name: Connect a client (must be welcomed)
        run: docker compose -f docker-compose.dev.yml --profile smoke run --rm smoke-client
      - name: Restart and connect again
        run: |
          docker compose -f docker-compose.dev.yml restart server
          sleep 10
          docker compose -f docker-compose.dev.yml --profile smoke run --rm smoke-client
      - name: Server log
        if: always()
        run: docker compose -f docker-compose.dev.yml logs server
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  # Benchmark B2 short run (M0-07, TDD §8 spike 2): 16 bots at 150 ms RTT / 2% loss (tc netem) against the server image, 30 s
  # warm-up + 60 s measured. Gates the network checks (bandwidth budget, all bots in session, reconnect, duplicate intent);
  # tick timings on CI hardware are trend only (M0-07 A6).
  b2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - name: Run B2 (short)
        run: B2_MEASURE_TICKS=1800 bash scripts/run-b2.sh
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-results
          path: source/b2-results
